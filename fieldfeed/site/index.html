<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{tagline}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{tagline}}">
<meta name="generator" content="fieldfeed {{version}}">
<meta name="fieldfeed-build" content="{{build}}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" href="feed.xml" title="{{title}}: top stories">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v={{build}}">
<script>
  try { const t = localStorage.getItem("ff-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#stories">Skip to stories</a>

<header class="mast">
  <div class="wrap mast-bar">
    <a class="brand" href="./" aria-label="Home">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
      <span>{{title}}</span>
    </a>
    <div class="mast-actions">
      <a class="pill-link" href="feed.xml" title="Subscribe to the top stories">RSS</a>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <div class="wrap mast-hero">
    <p class="dateline" id="dateline">&nbsp;</p>
    <h1>{{title}}</h1>
    <p class="tagline">{{tagline}}</p>
  </div>
  <div class="wrap">
    <nav class="windows" id="windows" role="tablist" aria-label="Time window"></nav>
  </div>
</header>

<main class="wrap layout">
  <div class="col-main">
    <section class="brief" id="brief" hidden>
      <h2 class="eyebrow">In brief</h2>
      <ul id="brief-list"></ul>
    </section>

    <section id="stories" class="stories">
      <div class="section-head">
        <h2 class="section-title">What mattered</h2>
        <p class="section-note" id="stories-note"></p>
      </div>
      <ol id="story-list" class="story-list"></ol>
    </section>

    <section id="feed" class="feed">
      <div class="section-head">
        <h2 class="section-title">Everything</h2>
        <p class="section-note" id="feed-count"></p>
      </div>
      <div class="controls">
        <label class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search titles, authors, text" autocomplete="off">
        </label>
        <div class="seg" role="group" aria-label="Sort">
          <button type="button" data-sort="top" class="on">Top</button>
          <button type="button" data-sort="new">Newest</button>
        </div>
      </div>
      <div class="chips" id="kinds" role="group" aria-label="Filter by type"></div>
      <div class="toggles">
        <label class="check" id="lowrel-wrap" hidden><input type="checkbox" id="show-low"> Show off-topic items</label>
        <label class="check"><input type="checkbox" id="only-starred"> Starred only</label>
        <button type="button" class="link-btn" id="clear-source" hidden></button>
      </div>
      <div id="feed-list" class="feed-list" aria-live="polite"></div>
      <button type="button" class="more-btn" id="more" hidden>Show more</button>
    </section>
  </div>

  <aside class="col-side">
    <section class="panel">
      <h2 class="eyebrow">Sources</h2>
      <ul class="source-list" id="source-list"></ul>
    </section>
    <section class="panel">
      <h2 class="eyebrow">About this page</h2>
      <p class="about" id="about-field"></p>
      <dl class="stats" id="stats"></dl>
    </section>
  </aside>
</main>

<footer class="wrap foot">
  <p>Built with fieldfeed. Summaries are machine-written from the linked posts; the posts are the source of truth.</p>
</footer>

<template id="empty">
  <div class="empty"><p>Nothing here yet for this window.</p></div>
</template>

<script src="app.js?v={{build}}" defer></script>
</body>
</html>
