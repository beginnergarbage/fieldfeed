name: Update dashboard

on:
  schedule:
    - cron: "17 */4 * * *"   # every four hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [field.yaml, "fieldfeed/**", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install .

      # The item database carries scores and cached summaries between runs.
      - name: Restore item history
        uses: actions/cache/restore@v4
        with:
          path: data
          key: fieldfeed-db-${{ github.run_id }}
          restore-keys: fieldfeed-db-

      - id: pages
        uses: actions/configure-pages@v5

      - name: Fetch, rank, summarize, build
        env:
          FIELDFEED_SITE_URL: ${{ steps.pages.outputs.base_url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: fieldfeed run

      - name: Save item history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: fieldfeed-db-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
