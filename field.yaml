field: computational biology
title: Computational Biology Feed
tagline: Genomics, protein modeling, single-cell analysis and machine learning for biology, in one stream.
description: 'Covers computational and systems biology: genomics and sequence analysis, protein structure
  prediction and design, single-cell and spatial omics, biological foundation models, bioinformatics methods
  and tools, and ML applied to drug discovery. On topic are new methods, benchmarks, datasets, software
  releases and community discussion. Off topic are purely wet-lab protocols, clinical news without a computational
  angle, and general biotech business or stock coverage.'
