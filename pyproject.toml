[project]
name = "fieldfeed"
version = "0.1.0"
description = "One page for everything happening in your field: forums, papers, newsletters, Bluesky, X, Reddit and HN, ranked and summarized by the model of your choice."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
fieldfeed = "fieldfeed.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
